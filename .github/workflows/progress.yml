name: Refresh progress page

on:
  schedule:
    # Hourly, weekdays, covering 09:00-18:00 UK across BST and GMT.
    - cron: "0 8-18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: progress-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate from Solidtime
        env:
          SOLIDTIME_TOKEN: ${{ secrets.SOLIDTIME_TOKEN }}
          SOLIDTIME_URL: ${{ secrets.SOLIDTIME_URL }}
          SOLIDTIME_ORG: ${{ secrets.SOLIDTIME_ORG }}
        run: python3 scripts/gen_progress.py

      - name: Commit if the numbers moved
        run: |
          # The date line always changes, so ignore it when deciding.
          if git diff -U0 -- index.html | grep '^[-+][^-+]' | grep -vq 'Last updated'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore(progress): refresh tracked time from Solidtime"
            git push
          else
            echo "No change since the last run."
          fi
